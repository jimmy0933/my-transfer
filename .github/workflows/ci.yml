name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CameraTranslator

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests
      run: ./gradlew test

    - name: Run Lint
      run: ./gradlew lint

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CameraTranslator-debug
        path: CameraTranslator/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Check if Secret is set for Release
      id: check_secret
      run: |
        if [ "${{ secrets.KEYSTORE_BASE64 }}" != "" ]; then
          echo "has_secret=true" >> $GITHUB_ENV
        else
          echo "has_secret=false" >> $GITHUB_ENV
        fi

    - name: Decode Keystore
      if: env.has_secret == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

    - name: Build Release APK
      if: env.has_secret == 'true'
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Release APK
      if: env.has_secret == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: CameraTranslator-release
        path: CameraTranslator/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
